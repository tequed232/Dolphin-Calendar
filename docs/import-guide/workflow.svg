<svg xmlns="http://www.w3.org/2000/svg" width="880" height="192" viewBox="0 0 880 192" role="img" aria-labelledby="title desc"><title id="title">AI 课表导入流程</title><desc id="desc">课表与提示词，补齐信息，取得JSON，回到Dolphin预览确认。全部图形为教学示意。</desc><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif}.label{font-size:19px;font-weight:650;fill:#183c40}.hint{font-size:13px;fill:#44666b}.num{font-size:13px;font-weight:700;fill:#007f89}.arrow{stroke:#007f89;stroke-width:2;fill:none}</style><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="#007f89"/></marker></defs><g fill="#e9f3f3" stroke="#bed8d9"><rect x="8" y="22" width="184" height="148" rx="20"/><rect x="233" y="22" width="184" height="148" rx="20"/><rect x="458" y="22" width="184" height="148" rx="20"/><rect x="683" y="22" width="189" height="148" rx="20"/></g><g text-anchor="middle"><text x="100" y="52" class="num">01 / 02</text><text x="100" y="94" class="label">课表 + 提示词</text><text x="100" y="123" class="hint">截图、表格、作息表</text><text x="325" y="52" class="num">03 / 04</text><text x="325" y="94" class="label">AI 整理</text><text x="325" y="123" class="hint">补齐日期、作息、周次</text><text x="550" y="52" class="num">04</text><text x="550" y="94" class="label">{ JSON }</text><text x="550" y="123" class="hint">学期 + 作息 + 课程</text><text x="777" y="52" class="num">05 / 06</text><text x="777" y="94" class="label">Dolphin 预览</text><text x="777" y="123" class="hint">核对后，确认导入</text></g><g class="arrow" marker-end="url(#a)"><path d="M201 96h23"/><path d="M426 96h23"/><path d="M651 96h23"/></g></svg>
